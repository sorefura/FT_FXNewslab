name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements-dev.txt
      - run: >-
          python -m pytest -q
          --cov=packages/fx_core/src
          --cov=packages/fx_signal_store/src
          --cov=apps/fx_research/src
          --cov=apps/swap_bot/src
          --cov-branch
          --cov-report=term-missing
          --cov-report=json
      - run: python -m ruff check .
      - run: python -m mypy packages apps

